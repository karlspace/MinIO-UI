# =============================================================================
# Admin Console for MinIO - Development Environment
# =============================================================================
#
# Startet eine vollstaendige Entwicklungsumgebung mit:
#   1. MinIO Server        - Object Storage Backend
#   2. MinIO Setup         - Init-Container: legt Admin-User und Demo-Bucket an
#   3. Admin Console       - Web-UI fuer MinIO Administration
#
# Verwendung:
#   docker compose -f docker-compose.development.yml up --build
#
# Nach dem Start:
#   - Admin Console:       http://localhost:9090  (Login: console / console)
#   - MinIO API:           http://localhost:9000
#   - MinIO Built-in UI:   http://localhost:9001  (Login: minioadmin / minioadmin)
#
# Konfiguration ueber .env Datei (siehe .env.example)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # MinIO Object Storage Server
  # ---------------------------------------------------------------------------
  # S3-kompatibler Object Storage. Dient als Backend fuer die Admin Console.
  # Port 9000 = S3 API, Port 9001 = MinIO eigene Web-UI (nicht unsere Console).
  # Daten werden im Volume 'minio-data' persistiert.
  # ---------------------------------------------------------------------------
  minio-server:
    image: quay.io/minio/minio:${MINIO_VERSION:-latest}
    container_name: minio-server
    restart: unless-stopped
    hostname: minio-server
    command: server --address ":9000" --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - TZ=${TIME_ZONE:-Etc/UTC}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Built-in Web-UI
    volumes:
      - minio-data:/data
    networks:
      - minio

  # ---------------------------------------------------------------------------
  # MinIO Setup (Init-Container)
  # ---------------------------------------------------------------------------
  # Einmaliger Container der nach dem MinIO-Start:
  #   1. Einen Admin-User fuer die Console anlegt (CONSOLE_ACCESS_KEY)
  #   2. Eine Policy mit vollen admin:* und s3:* Rechten erstellt
  #   3. Die Policy dem Console-User zuweist
  #   4. Einen Demo-Bucket anlegt
  #
  # Laeuft nur einmal durch und beendet sich dann (exit 0).
  # Bei erneutem 'docker compose up' werden bestehende User/Buckets
  # uebersprungen (--ignore-existing / || true).
  # ---------------------------------------------------------------------------
  minio-setup:
    image: quay.io/minio/mc:${MINIO_MC_VERSION:-latest}
    container_name: minio-setup
    depends_on:
      minio-server:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - CONSOLE_ACCESS_KEY=${CONSOLE_ACCESS_KEY:-console}
      - CONSOLE_SECRET_KEY=${CONSOLE_SECRET_KEY:-console}
      - MINIO_REGION=${MINIO_REGION:-us-east-1}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo '=== MinIO Setup ==='
        sleep 5

        # mc Client mit Root-Credentials verbinden
        mc alias set minio http://minio-server:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}

        # 1. Admin-User fuer die Console anlegen
        echo 'Erstelle Console-User: '$${CONSOLE_ACCESS_KEY}
        mc admin user add minio $${CONSOLE_ACCESS_KEY} $${CONSOLE_SECRET_KEY} || true

        # 2. Policy mit vollen Admin- und S3-Rechten
        echo 'Erstelle Admin-Policy...'
        cat > /tmp/admin-policy.json << EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Action": ["admin:*"],
              "Effect": "Allow"
            },
            {
              "Action": ["s3:*"],
              "Effect": "Allow",
              "Resource": ["arn:aws:s3:::*"]
            }
          ]
        }
        EOF
        mc admin policy create minio consoleAdmin /tmp/admin-policy.json || true

        # 3. Policy dem Console-User zuweisen
        mc admin policy attach minio consoleAdmin --user $${CONSOLE_ACCESS_KEY} || true

        # 4. Demo-Bucket anlegen
        echo 'Erstelle Demo-Bucket...'
        mc mb --ignore-existing minio/demo-bucket

        # Ergebnis ausgeben
        echo ''
        echo '=== Setup abgeschlossen ==='
        echo 'Console Login: '$${CONSOLE_ACCESS_KEY}' / '$${CONSOLE_SECRET_KEY}
        echo ''
        mc admin user list minio
        mc ls minio
    networks:
      - minio

  # ---------------------------------------------------------------------------
  # Admin Console for MinIO
  # ---------------------------------------------------------------------------
  # Web-basierte Admin-Oberflaeche. Verbindet sich ueber die S3/Admin-API
  # mit dem MinIO Server. Wird aus dem Dockerfile gebaut (Go Backend + React
  # Frontend in einem Multi-Stage Build).
  #
  # Startet erst nachdem minio-setup erfolgreich durchgelaufen ist,
  # damit der Console-User bereits existiert.
  # ---------------------------------------------------------------------------
  console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: admin-console-minio
    restart: unless-stopped
    environment:
      # Verbindung zum MinIO Server (Docker-interner Hostname)
      CONSOLE_MINIO_SERVER: "http://minio-server:9000"
      CONSOLE_MINIO_REGION: "${MINIO_REGION:-us-east-1}"
    expose:
      - "9090/tcp"
    ports:
      - "${CONSOLE_PORT:-9090}:9090"   # Admin Console Web-UI
    depends_on:
      minio-server:
        condition: service_healthy    
      minio-setup:
        condition: service_completed_successfully
    networks:
      - minio

# =============================================================================
# Netzwerk und Volumes
# =============================================================================

networks:
  minio:
    driver: bridge

volumes:
  minio-data:
  # MinIO Daten. 'docker compose down -v' loescht auch die Daten.
